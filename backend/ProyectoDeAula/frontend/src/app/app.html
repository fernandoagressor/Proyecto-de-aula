<div class="app-container">

  <!-- LOGIN -->
  <div *ngIf="!usuarioLogueado" class="login-wrapper">
    <div class="login-card">

      <div class="login-header">
        <h1>PrestaFácil</h1>
        <p>Sistema de préstamos</p>
      </div>

      <div class="login-form">

        <label>Usuario</label>
        <input
          [(ngModel)]="loginNombre"
          placeholder="Ingrese su usuario"
        />

        <label>Contraseña</label>
        <input
          [(ngModel)]="loginPassword"
          type="password"
          placeholder="Ingrese su contraseña"
        />

        <button class="btn-primary" (click)="iniciarSesion()">
          Ingresar
        </button>

        <p class="error-text" *ngIf="mensajeLogin">
          {{ mensajeLogin }}
        </p>

      </div>
    </div>
  </div>

  <!-- SISTEMA -->
  <div *ngIf="usuarioLogueado" class="dashboard-layout">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="brand">
        <h2>PrestaFácil</h2>
        <span>Panel financiero</span>
      </div>

      <div class="user-box">
        <div class="user-info">
          <strong>{{ usuarioLogueado.nombre }}</strong>
          <span>{{ usuarioLogueado.rol }}</span>
        </div>

        <button class="btn-logout" (click)="cerrarSesion()">
          Cerrar sesión
        </button>
      </div>
    </header>

    <!-- CONTENIDO -->
    <main class="main-content">

      <!-- DASHBOARD -->
      <section class="section-card">
        <app-dashboard></app-dashboard>
      </section>

      <!-- CONFIGURACIÓN (RF001 - SOLO ADMIN) -->
      <section class="section-card" *ngIf="esAdmin()">
        <app-configuracion></app-configuracion>
      </section>

      <!-- USUARIOS (SOLO ADMIN) -->
      <section class="section-card" *ngIf="esAdmin()">
        <app-usuarios></app-usuarios>
      </section>

      <!-- CLIENTES -->
      <section class="section-card" *ngIf="esAdmin() || esEmpleado()">
        <app-clientes></app-clientes>
      </section>

      <!-- PRÉSTAMOS -->
      <section class="section-card" *ngIf="esAdmin() || esEmpleado()">
        <app-prestamos></app-prestamos>
      </section>

    </main>

  </div>
</div>
