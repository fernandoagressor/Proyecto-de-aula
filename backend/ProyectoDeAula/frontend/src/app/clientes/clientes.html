<div class="page-card">
  <h2 class="page-title">Clientes</h2>

  <div class="form-grid">
    <input
      class="input-modern"
      type="text"
      [(ngModel)]="nuevoCliente.nombre"
      placeholder="Nombre"
    />

    <input
      class="input-modern"
      type="text"
      [(ngModel)]="nuevoCliente.cedula"
      placeholder="Cédula"
    />

    <input
      class="input-modern"
      type="text"
      [(ngModel)]="nuevoCliente.telefono"
      placeholder="Teléfono"
    />

    <input
      class="input-modern"
      type="text"
      [(ngModel)]="nuevoCliente.direccion"
      placeholder="Dirección"
    />

    <button
      class="btn-main"
      *ngIf="!clienteEditando"
      (click)="crearCliente()"
    >
      Crear Cliente
    </button>

    <button
      class="btn-main"
      *ngIf="clienteEditando"
      (click)="actualizarCliente()"
    >
      Actualizar Cliente
    </button>

    <button
      class="btn-delete"
      *ngIf="clienteEditando"
      (click)="cancelarEdicion()"
    >
      Cancelar
    </button>
  </div>

  <div class="table-wrapper">
    <table class="table-modern">
      <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Cédula</th>
        <th>Teléfono</th>
        <th>Dirección</th>
        <th>Acciones</th>
      </tr>
      </thead>

      <tbody>
      <tr *ngFor="let cliente of clientes">
        <td>{{ cliente.id }}</td>
        <td>{{ cliente.nombre }}</td>
        <td>{{ cliente.cedula }}</td>
        <td>{{ cliente.telefono }}</td>
        <td>{{ cliente.direccion }}</td>
        <td>
          <div class="actions-box">
            <button class="btn-edit" (click)="editarCliente(cliente)">Editar</button>
            <button class="btn-delete" (click)="eliminarCliente(cliente.id)">Eliminar</button>
          </div>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
