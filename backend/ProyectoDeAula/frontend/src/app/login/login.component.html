<div class="login-container">
  <div class="login-card">
    <h1>PrestaFácil</h1>
    <p>Sistema de préstamos</p>

    <input
      type="text"
      placeholder="Usuario"
      [(ngModel)]="loginNombre"
    />

    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="loginPassword"
    />

    <button (click)="iniciarSesion()">Ingresar</button>

    <p class="error" *ngIf="mensajeLogin">{{ mensajeLogin }}</p>
  </div>
</div>
