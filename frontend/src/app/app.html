<div style="text-align:center; margin-top:30px;">
  <h1>Usuarios</h1>

  <div style="margin-bottom:20px;">
    <input
      type="text"
      placeholder="Nombre"
      [(ngModel)]="nombre"
      style="padding:8px; margin-right:10px;"
    >

    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
      style="padding:8px; margin-right:10px;"
    >

    <select
      [(ngModel)]="rol"
      style="padding:8px; margin-right:10px;"
    >
      <option value="">Seleccione rol</option>
      <option value="administrador">Administrador</option>
      <option value="empleado">Empleado</option>
    </select>

    <button
      (click)="crearUsuario()"
      style="padding:8px 14px;"
    >
      Guardar
    </button>
  </div>

  <table border="1" style="margin:auto; margin-top:20px; border-collapse: collapse; min-width: 500px;">
    <tr>
      <th style="padding:10px;">ID</th>
      <th style="padding:10px;">Nombre</th>
      <th style="padding:10px;">Rol</th>
      <th style="padding:10px;">Acciones</th>
    </tr>

    <tr *ngFor="let usuario of usuarios">
      <td style="padding:10px;">{{ usuario.id }}</td>
      <td style="padding:10px;">{{ usuario.nombre }}</td>
      <td style="padding:10px;">{{ usuario.rol }}</td>
      <td style="padding:10px;">
        <button (click)="eliminarUsuario(usuario.id)">
          Eliminar
        </button>
      </td>
    </tr>
  </table>
</div>
